<!DOCTYPE html>
<html>
<head>
    <title>Billing Management</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        form {
            text-align: center;
            padding: 30px 40px;
            border: 2px solid #333;
            border-radius: 8px;
            background-color: #f9f9f9;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }
    </style>
</head>
<body>
    <h1>Billing Management</h1>

    <form>
        <label>Consultation Fee:</label>
        <input type="number">
        <br><br>

        <label>Service Charges:</label>
        <input type="number">
        <br><br>

        <label>Medicine Charges:</label>
        <input type="number">
        <br><br>

        <button type="button">Calculate Total</button>
        <br><br>

        <button type="button">Display Bill</button>
    </form>
</body>
</html>
