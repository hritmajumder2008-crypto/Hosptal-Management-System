<!DOCTYPE html>
<html>

<head>
    <title>Appointment Management</title>
</head>

<body>

    <h1>Appointment Management</h1>

    <form>

        <label>Appointment ID:</label>
        <input type="number">
        <br><br>

        <label>Patient ID:</label>
        <input type="number">
        <br><br>

        <label>Doctor Name:</label>
        <input type="text">
        <br><br>

        <label>Date:</label>
        <input type="text">
        <br><br>

        <label>Time:</label>
        <input type="text">
        <br><br>

        <button type="submit">Book Appointment</button>
    </form>
</body>
</html>
